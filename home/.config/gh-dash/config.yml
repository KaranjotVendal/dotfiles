prSections:
    - title: My Pull Requests
      filters: is:open author:@me
    - title: Needs My Review
      filters: is:open review-requested:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
issuesSections:
    - title: My Issues
      filters: is:open author:@me
    - title: Assigned
      filters: is:open assignee:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
notificationsSections:
    - title: All
      filters: ""
    - title: Created
      filters: reason:author
    - title: Participating
      filters: reason:participating
    - title: Mentioned
      filters: reason:mention
    - title: Review Requested
      filters: reason:review-requested
    - title: Assigned
      filters: reason:assign
    - title: Subscribed
      filters: reason:subscribed
    - title: Team Mentioned
      filters: reason:team-mention
repo:
    branchesRefetchIntervalSeconds: 30
    prsRefetchIntervalSeconds: 60
defaults:
    preview:
        open: true
        width: 50
    prsLimit: 20
    prApproveComment: LGTM
    issuesLimit: 20
    notificationsLimit: 20
    view: prs
    layout:
        prs:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 20
            author:
                width: 15
            authorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
            base:
                width: 15
                hidden: true
            lines:
                width: 15
        issues:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 15
            creator:
                width: 10
            creatorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
    refetchIntervalMinutes: 30
# Lazygit integration - press 'L' (shift+L) to open lazygit in the current PR's repo
# ENHANCE integration - press 'T' to view GitHub Actions for the PR
# Copy Actions logs - press 'A' to copy failed logs to clipboard for AI analysis
keybindings:
  universal:
    - key: L
      name: lazygit
      command: >
        cd {{.RepoPath}} && lazygit
  prs:
    - key: T
      name: enhance (GitHub Actions)
      command: gh enhance -R {{.RepoName}} {{.PrNumber}}
    - key: A
      name: save actions logs for AI
      command: >
        gh run list -R {{.RepoName}} -b {{.HeadRefName}} --json databaseId -L 1 | 
        jq -r '.[0].databaseId' | 
        xargs -I{} gh run view -R {{.RepoName}} {} --log-failed | 
        tee /tmp/gh-actions-error.log && 
        echo "Logs saved to /tmp/gh-actions-error.log" && 
        echo "Copy to your coding agent with: cat /tmp/gh-actions-error.log"

# Map GitHub repos to local paths
# Your projects are stored in ~/Desktop/Personal_projects/Machine_Learning/
repoPaths:
  # All GitHub repos map to your Machine_Learning folder
  "*/*": "~/Desktop/Personal_projects/Machine_Learning/*"
theme:
    ui:
        sectionsShowCount: true
        table:
            showSeparator: true
            compact: false
pager:
    diff: diffnav
    
    # Alternative: Use delta directly with more context
    # pager: delta --max-line-distance 0.6
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
